[workspace]
authors = ["Alexander Fischer <alexander-fischer1801@t-online.de>"]
channels = ["conda-forge"]
name = "within-paper"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
compile = "python -m scripts.paper_results render && python -m scripts.make_figures headline && typst compile graph_preconditioner_hdfe.typ graph_preconditioner_hdfe.pdf"
check-external-runtimes ={ cmd = "python -m scripts.paper_results check-external-runtimes", description = "Check installed R and Julia versions, packages, and thread counts" }
setup-julia-env = { cmd = "python -m scripts.paper_results setup-julia-env", description = "Install Julia packages from the tracked project" }
fetch-correia = { cmd = "python -m scripts.paper_results fetch-correia", description = "Download the Correia HDFE CSVs and verify their checksums" }
check-correia-data = { cmd = "python -m scripts.paper_results fetch-correia --offline", description = "Verify the local Correia CSV collection without downloading" }
agreement = { cmd = "python -m benchmarks.ols.agreement", depends-on = ["setup-julia-env"], description = "Run numerical agreement checks from the OLS implementations" }
test = { cmd = "python -m unittest discover -s tests -t . -v", description = "Run benchmark regression tests" }
bench-memory = { cmd = "python -m benchmarks.memory", description = "Measure peak RSS and runtime for PyFixest MAP and within (100K, 1M)" }
bench-main = { cmd = "python -m benchmarks.ols.main", depends-on = ["setup-julia-env"], description = "Run the headline OLS comparison" }
bench-fepois = { cmd = "python -m benchmarks.ppml.run", depends-on = ["setup-julia-env"], description = "Run the headline PPML comparison" }
bench-akm = { cmd = "python -m benchmarks.ols.akm", depends-on = ["setup-julia-env"], description = "Run the AKM package and mechanism comparisons" }
within-preconditioners = { cmd = "python -m benchmarks.within.preconditioners", description = "Standalone within setup/solve/iteration/residual diagnostics for off/diagonal/additive" }
make-figures = { cmd = "python -m scripts.make_figures", depends-on = ["bench-tolerance"], description = "Generate paper figures from collected canonical results and recorded tolerance results" }
bench-amortization = { cmd = "python -m benchmarks.within.amortization", description = "Measure additive setup across AKM connectivity and reuse across ten regressions" }
bench-tolerance = { cmd = "python -m benchmarks.tolerance.akm_frontier", depends-on = ["setup-julia-env"], description = "Runtime against achieved precision on the AKM mobility designs" }
bench-correia = { cmd = "python -m benchmarks.ols.correia", depends-on = ["setup-julia-env", "check-correia-data"], description = "Run the local Correia comparisons after checksum verification" }
compute-hardness = { cmd = "python -m scripts.compute_hardness", depends-on = ["check-correia-data"], description = "Compute pairwise spectral gaps after singleton pruning" }
collect-paper-results = { cmd = "python -m scripts.paper_results collect", description = "Fold existing benchmark CSVs into the paper tables without rerunning benchmarks" }
reproduce-results = { cmd = "python -m scripts.paper_results collect && python -m scripts.make_figures", depends-on = ["check-external-runtimes", "agreement", "bench-memory", "within-preconditioners", "bench-amortization", "bench-tolerance", "compute-hardness", "bench-main", "bench-fepois", "bench-akm", "bench-correia"], description = "Run the full benchmark suite, collect canonical results, and generate figures" }
render-paper-results = { cmd = "python -m scripts.paper_results render", description = "Write Typst tables from the paper result file" }
reproduce-paper = { cmd = "python -m scripts.paper_results render && typst compile graph_preconditioner_hdfe.typ graph_preconditioner_hdfe.pdf", depends-on = ["reproduce-results"], description = "Run benchmarks, render tables, and build the PDF" }

[dependencies]
# Figures are generated from recorded results, never drawn by hand.
# Pinned exactly: the tracked SVGs are byte-compared, and matplotlib
# changes tight-bbox geometry between minor versions, so a float here
# silently rewrites every figure.
matplotlib-base = "==3.11.1"
typst = ">=0.14.2,<0.15"
python = ">=3.14.4,<3.15"
scipy = ">=1.11"

[pypi-dependencies]
pyfixest = ">=0.60.0"
pyarrow = ">=19.0.0"
# Pinned to the version that produced the tracked SVGs. A PyPI matplotlib
# arrives transitively via seaborn and shadows the conda matplotlib-base, so
# the pin has to be here or the two disagree.
matplotlib = "==3.11.1"
within-py = ">=0.2.0"
