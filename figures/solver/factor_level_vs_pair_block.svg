<svg viewBox="0 0 590 350" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      text { fill: #2f3437; }
      .title { font-size: 14px; font-weight: 700; }
      .subtitle { font-size: 10.5px; fill: #68727a; }
      .label { font-size: 10.5px; font-weight: 700; }
      .entry { font-size: 12px; font-weight: 700; }
      .grid { fill: #fbfbfd; stroke: #d8dee8; stroke-width: 0.8; }
      .block-line { stroke: #929ca6; stroke-width: 1.5; }
      .worker, .firm { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.1; }
      .cross { fill: #ffedd5; stroke: #c2410c; stroke-width: 1.1; }
    </style>
  </defs>

  <rect width="590" height="350" fill="#ffffff"/>
  <rect x="8" y="8" width="282" height="292" rx="12" fill="#fbfcfd" stroke="#e3e7eb"/>
  <rect x="300" y="8" width="282" height="292" rx="12" fill="#fbfcfd" stroke="#e3e7eb"/>

  <text x="165" y="30" text-anchor="middle" class="title">Diagonal preconditioner</text>
  <text x="165" y="48" text-anchor="middle" class="subtitle">worker and firm counts only</text>
  <text x="425" y="30" text-anchor="middle" class="title">Factor-pair correction</text>
  <text x="425" y="48" text-anchor="middle" class="subtitle">adds worker-firm match counts</text>

  <!-- Shared row and column labels -->
  <g class="label">
    <text x="105" y="72" text-anchor="middle">W1</text><text x="135" y="72" text-anchor="middle">W2</text>
    <text x="165" y="72" text-anchor="middle">W3</text><text x="195" y="72" text-anchor="middle">F1</text>
    <text x="225" y="72" text-anchor="middle">F2</text>
    <text x="82" y="101" text-anchor="end">W1</text><text x="82" y="131" text-anchor="end">W2</text>
    <text x="82" y="161" text-anchor="end">W3</text><text x="82" y="191" text-anchor="end">F1</text>
    <text x="82" y="221" text-anchor="end">F2</text>

    <text x="365" y="72" text-anchor="middle">W1</text><text x="395" y="72" text-anchor="middle">W2</text>
    <text x="425" y="72" text-anchor="middle">W3</text><text x="455" y="72" text-anchor="middle">F1</text>
    <text x="485" y="72" text-anchor="middle">F2</text>
    <text x="342" y="101" text-anchor="end">W1</text><text x="342" y="131" text-anchor="end">W2</text>
    <text x="342" y="161" text-anchor="end">W3</text><text x="342" y="191" text-anchor="end">F1</text>
    <text x="342" y="221" text-anchor="end">F2</text>
  </g>

  <!-- Left: block-diagonal worker and firm counts -->
  <g>
    <rect x="90" y="80" width="150" height="150" class="grid"/>
    <path d="M120 80V230 M150 80V230 M180 80V230 M210 80V230 M90 110H240 M90 140H240 M90 170H240 M90 200H240" class="grid" fill="none"/>
    <rect x="90" y="80" width="30" height="30" class="worker"/>
    <rect x="120" y="110" width="30" height="30" class="worker"/>
    <rect x="150" y="140" width="30" height="30" class="worker"/>
    <rect x="180" y="170" width="30" height="30" class="firm"/>
    <rect x="210" y="200" width="30" height="30" class="firm"/>
    <path d="M180 80V230 M90 170H240" class="block-line"/>
    <g class="entry">
      <text x="105" y="101" text-anchor="middle" fill="#1d4ed8">2</text>
      <text x="135" y="131" text-anchor="middle" fill="#1d4ed8">2</text>
      <text x="165" y="161" text-anchor="middle" fill="#1d4ed8">2</text>
      <text x="195" y="191" text-anchor="middle" fill="#1d4ed8">3</text>
      <text x="225" y="221" text-anchor="middle" fill="#1d4ed8">3</text>
    </g>
    <text x="165" y="255" text-anchor="middle" font-size="11.5" font-style="italic">diag(G<tspan baseline-shift="sub" font-size="8">WW</tspan>, G<tspan baseline-shift="sub" font-size="8">FF</tspan>)</text>
    <text x="165" y="278" text-anchor="middle" font-size="10.5" fill="#68727a">The two factors are corrected separately.</text>
  </g>

  <!-- Right: worker-firm factor-pair Gramian -->
  <g>
    <rect x="350" y="80" width="150" height="150" class="grid"/>
    <path d="M380 80V230 M410 80V230 M440 80V230 M470 80V230 M350 110H500 M350 140H500 M350 170H500 M350 200H500" class="grid" fill="none"/>

    <rect x="350" y="80" width="30" height="30" class="worker"/>
    <rect x="380" y="110" width="30" height="30" class="worker"/>
    <rect x="410" y="140" width="30" height="30" class="worker"/>
    <rect x="440" y="170" width="30" height="30" class="firm"/>
    <rect x="470" y="200" width="30" height="30" class="firm"/>

    <rect x="440" y="80" width="30" height="30" class="cross"/><rect x="470" y="80" width="30" height="30" class="cross"/>
    <rect x="440" y="110" width="30" height="30" class="cross"/><rect x="470" y="140" width="30" height="30" class="cross"/>
    <rect x="350" y="170" width="30" height="30" class="cross"/><rect x="380" y="170" width="30" height="30" class="cross"/>
    <rect x="350" y="200" width="30" height="30" class="cross"/><rect x="410" y="200" width="30" height="30" class="cross"/>

    <path d="M440 80V230 M350 170H500" class="block-line"/>
    <g class="entry">
      <text x="365" y="101" text-anchor="middle" fill="#1d4ed8">2</text>
      <text x="395" y="131" text-anchor="middle" fill="#1d4ed8">2</text>
      <text x="425" y="161" text-anchor="middle" fill="#1d4ed8">2</text>
      <text x="455" y="191" text-anchor="middle" fill="#1d4ed8">3</text>
      <text x="485" y="221" text-anchor="middle" fill="#1d4ed8">3</text>

      <text x="455" y="101" text-anchor="middle" fill="#9a3412">1</text><text x="485" y="101" text-anchor="middle" fill="#9a3412">1</text>
      <text x="455" y="131" text-anchor="middle" fill="#9a3412">2</text><text x="485" y="161" text-anchor="middle" fill="#9a3412">2</text>
      <text x="365" y="191" text-anchor="middle" fill="#9a3412">1</text><text x="395" y="191" text-anchor="middle" fill="#9a3412">2</text>
      <text x="365" y="221" text-anchor="middle" fill="#9a3412">1</text><text x="425" y="221" text-anchor="middle" fill="#9a3412">2</text>
    </g>
    <text x="425" y="255" text-anchor="middle" font-size="11.5" font-style="italic">G<tspan baseline-shift="sub" font-size="8">WF</tspan></text>
    <text x="425" y="278" text-anchor="middle" font-size="10.5" fill="#68727a">The correction also uses C<tspan baseline-shift="sub" font-size="8">WF</tspan>.</text>
  </g>

  <text x="295" y="316" text-anchor="middle" font-size="10.8" fill="#48525a">Orange cells are worker-firm counts omitted by diagonal preconditioning.</text>

  <g transform="translate(115 329)">
    <rect x="0" y="0" width="12" height="12" class="worker"/><text x="18" y="10" font-size="9.8">diagonal count blocks</text>
    <rect x="220" y="0" width="12" height="12" class="cross"/><text x="238" y="10" font-size="9.8">worker-firm match counts</text>
  </g>
</svg>
